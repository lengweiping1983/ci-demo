name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 步骤1：拉取你的代码到虚拟机上（必做！）
      - uses: actions/checkout@v4

      # 步骤2：安装 Node.js 环境（指定版本）
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm        # 自动缓存 node_modules，加速下次构建

      # 步骤3：安装依赖
      - name: 安装依赖
        run: npm ci          # npm ci 比 npm install 更适合 CI，可复现性好

      # 步骤4：跑测试
      - name: 运行测试
        run: npm test

      # 步骤5：构建（如果有构建步骤的话）
      - name: 构建项目
        run: npm run build --if-present